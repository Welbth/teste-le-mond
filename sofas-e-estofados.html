<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sofás &amp; Estofados &bull; Le Mond</title>

    <!-- Google Fonts: Fraunces & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="ref-design-systems/admmobiliario.com.br_pt/assets/eeb17a45a48aca1d_all.css" rel="stylesheet" />

    <!-- Design System & Site Styles -->
    <link href="styles.css" rel="stylesheet" />
</head>

<body>

    <!-- Ambient Luxury Background -->
    <div class="ds-ambient-bg">
        <svg class="ds-noise-texture" xmlns="http://www.w3.org/2000/svg">
            <filter id="dsNoiseFilter">
                <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" />
            </filter>
            <rect width="100%" height="100%" filter="url(#dsNoiseFilter)" />
        </svg>
        <div class="ds-light-ray ds-ray-1"></div>
        <div class="ds-light-ray ds-ray-2"></div>
        <div class="ds-light-ray ds-ray-3"></div>
    </div>

    <!-- Header Navigation (Loaded via JS) -->
    <div id="ds-header-placeholder"></div>

    <!-- MAIN CATEGORY CATALOG PAGE -->
    <main>
        
        <!-- Breadcrumb Navigation -->
        <div class="ds-product-breadcrumb-wrap">
            <div class="ds-container">
                <nav class="ds-breadcrumb" aria-label="Navegação">
                    <a href="/">Le Mond</a>
                    <span>&rsaquo;</span>
                    <a href="moveis">Móveis</a>
                    <span>&rsaquo;</span>
                    <span style="color: var(--ds-text-main); font-weight: 600;">Sofás &amp; Estofados</span>
                </nav>
            </div>
        </div>

        <!-- CATEGORY HERO SECTION -->
        <section class="ds-product-hero-section" style="padding-bottom: 0;">
            <div class="ds-container">
                <div style="text-align: center;">
                    <h1 class="ds-product-title" style="font-size: clamp(36px, 5vw, 56px); margin: 0 0 16px;">
                        Sofás &amp; <span class="italic">Estofados</span>
                    </h1>
                </div>

                <!-- FILTRO POR MARCA -->
                <div class="ds-brand-filter-bar">
                    <button class="ds-filter-pill active" onclick="filterCategoryByBrand('all', this)">Todas as marcas</button>
                    <button class="ds-filter-pill" onclick="filterCategoryByBrand('buriti', this)">Buriti</button>
                </div>
            </div>
        </section>

        <!-- CATALOG GRID SECTION -->
        <section class="ds-product-specs-section">
            <div class="ds-container">
                
                <div class="ds-category-grid">
                    
                    <!-- Card 1: Sofá Sonata -->
                    <div class="ds-category-product-card" data-brand="buriti">
                        <a href="sofa-sonata" class="ds-category-card-inner">
                            <div class="ds-category-card-stage">
                                <img src="sofa_sonata_frontal.webp" alt="Sofá Sonata" />
                            </div>
                            <div class="ds-category-card-info">
                                <span class="ds-category-card-brand">
                                    <i class="fas fa-circle" style="font-size: 5px;"></i> Buriti
                                </span>
                                <h3 class="ds-category-card-title">Sofá Sonata</h3>
                                <span class="ds-btn-solid ds-category-card-btn">
                                    Conhecer peça <i class="fas fa-arrow-right"></i>
                                </span>
                            </div>
                        </a>
                    </div>

                    <!-- Card 2: Sofá Lummier -->
                    <div class="ds-category-product-card" data-brand="buriti">
                        <a href="sofa-lummier" class="ds-category-card-inner">
                            <div class="ds-category-card-stage">
                                <img src="sofa_lummier_frontal.webp" alt="Sofá Lummier" />
                            </div>
                            <div class="ds-category-card-info">
                                <span class="ds-category-card-brand">
                                    <i class="fas fa-circle" style="font-size: 5px;"></i> Buriti
                                </span>
                                <h3 class="ds-category-card-title">Sofá Lummier</h3>
                                <span class="ds-btn-solid ds-category-card-btn">
                                    Conhecer peça <i class="fas fa-arrow-right"></i>
                                </span>
                            </div>
                        </a>
                    </div>

                    <!-- Card 3: Sofá Solace -->
                    <div class="ds-category-product-card" data-brand="buriti">
                        <a href="sofa-solace" class="ds-category-card-inner">
                            <div class="ds-category-card-stage">
                                <img src="sofa_solace_frontal.webp" alt="Sofá Solace" />
                            </div>
                            <div class="ds-category-card-info">
                                <span class="ds-category-card-brand">
                                    <i class="fas fa-circle" style="font-size: 5px;"></i> Buriti
                                </span>
                                <h3 class="ds-category-card-title">Sofá Solace</h3>
                                <span class="ds-btn-solid ds-category-card-btn">
                                    Conhecer peça <i class="fas fa-arrow-right"></i>
                                </span>
                            </div>
                        </a>
                    </div>

                    <!-- Card 4: Sofá Hush -->
                    <div class="ds-category-product-card" data-brand="buriti">
                        <a href="sofa-hush" class="ds-category-card-inner">
                            <div class="ds-category-card-stage">
                                <img src="sofa_hush_frontal.webp" alt="Sofá Hush" />
                            </div>
                            <div class="ds-category-card-info">
                                <span class="ds-category-card-brand">
                                    <i class="fas fa-circle" style="font-size: 5px;"></i> Buriti
                                </span>
                                <h3 class="ds-category-card-title">Sofá Hush</h3>
                                <span class="ds-btn-solid ds-category-card-btn">
                                    Conhecer peça <i class="fas fa-arrow-right"></i>
                                </span>
                            </div>
                        </a>
                    </div>

                    <!-- Card 5: Sofá Naturale -->
                    <div class="ds-category-product-card" data-brand="buriti">
                        <a href="sofa-naturale" class="ds-category-card-inner">
                            <div class="ds-category-card-stage">
                                <img src="sofa_naturale_frontal.webp" alt="Sofá Naturale" />
                            </div>
                            <div class="ds-category-card-info">
                                <span class="ds-category-card-brand">
                                    <i class="fas fa-circle" style="font-size: 5px;"></i> Buriti
                                </span>
                                <h3 class="ds-category-card-title">Sofá Naturale</h3>
                                <span class="ds-btn-solid ds-category-card-btn">
                                    Conhecer peça <i class="fas fa-arrow-right"></i>
                                </span>
                            </div>
                        </a>
                    </div>

                    <!-- Card 6: Sofá Albany -->
                    <div class="ds-category-product-card" data-brand="buriti">
                        <a href="sofa-albany" class="ds-category-card-inner">
                            <div class="ds-category-card-stage">
                                <img src="sofa_albany_frontal.webp" alt="Sofá Albany" />
                            </div>
                            <div class="ds-category-card-info">
                                <span class="ds-category-card-brand">
                                    <i class="fas fa-circle" style="font-size: 5px;"></i> Buriti
                                </span>
                                <h3 class="ds-category-card-title">Sofá Albany</h3>
                                <span class="ds-btn-solid ds-category-card-btn">
                                    Conhecer peça <i class="fas fa-arrow-right"></i>
                                </span>
                            </div>
                        </a>
                    </div>

                </div>

            </div>
        </section>

    </main>

    <!-- Footer (Loaded via JS) -->
    <div id="ds-footer-placeholder"></div>

    <!-- Scripts -->
    <script src="components.js"></script>
    <script>
        function filterCategoryByBrand(brand, element) {
            const pills = document.querySelectorAll('.ds-filter-pill');
            pills.forEach(p => p.classList.remove('active'));
            if (element) element.classList.add('active');

            const cards = document.querySelectorAll('.ds-category-product-card');
            cards.forEach(card => {
                const cardBrand = card.getAttribute('data-brand');
                if (brand === 'all' || cardBrand === brand) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>

</html>
